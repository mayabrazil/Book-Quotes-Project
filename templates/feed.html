<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BookQuotes — Explore</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<!-- Navigation -->
<nav class="navbar">
    <div class="nav-logo">📖 BookQuotes</div>
    <div class="nav-links">
        <a href="/home">Post a Quote</a>
        <a href="/explore" class="active">Explore</a>
        <a href="/myshelf">My Shelf</a>
    </div>
</nav>

<!-- Title -->
<div class="profile">
    <div class="profile-avatar">🔍</div>
    <h1>Explore Quotes</h1>
    <p class="bio">Browse recent quotes</p>
</div>

<div class="divider">✦ ✦ ✦</div>

<!-- QUOTES LIST -->
<div class="posted-quotes">

    {% for q in quotes %}
    <div class="quote-card">

        <div class="quote-user">
            {{ q.username }}
        </div>

        <p class="quote-text">"{{ q.quote }}"</p>

        <p class="quote-book">
            — {{ q.book }}, {{ q.author }}
        </p>

        <p class="quote-time">
            {{ q.timestamp }}
        </p>

        <div class="card-actions">

            <span class="mood-tag">{{ q.mood }}</span>

            <button class="btn-like" data-id="{{ q.id }}" onclick="likeQuote(this)">
                ♡ {{ q.likes }} Like
            </button>

            <button class="btn-save" data-id="{{ q.id }}" onclick="saveQuote(this)">
                🔖 Save
            </button>

        </div>
    </div>
    {% endfor %}

</div>

<!-- JS -->
<script>
function likeQuote(btn) {

    // prevent multiple likes
    if (btn.classList.contains("liked")) {
        return;
    }

    const id = btn.getAttribute("data-id");

    fetch('/like', {
        method: 'POST',

        headers: {
            'Content-Type': 'application/json'
        },

        body: JSON.stringify({
            id: Number(id)
        })
    })

    .then(res => res.json())

    .then(data => {

        btn.innerHTML = `♥ ${data.likes} Liked`;

        btn.classList.add("liked");

        btn.disabled = true;

        btn.style.opacity = "0.7";
    });
}

function saveQuote(btn) {
    const id = btn.getAttribute("data-id");

    fetch('/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: Number(id) })
    })
    .then(res => res.json())
    .then(() => {
        btn.innerHTML = "🔖 Saved";
        btn.disabled = true;
        btn.style.opacity = "0.6";
    });
}
</script>

</body>
</html>
